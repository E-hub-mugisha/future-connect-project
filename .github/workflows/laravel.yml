name: Deploy Laravel via FTP

on:
  push:
    branches:
      - main  # Change if you deploy from a different branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Setup PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v3
        with:
          php-version: 8.1
          extensions: mbstring, bcmath, curl, xml, json, openssl
          ini-values: post_max_size=256M, upload_max_filesize=256M
          coverage: none

      # Step 3: Install Composer dependencies (no dev)
      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist

      # Step 4: Setup Node.js & build front-end assets
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install NPM dependencies
        run: npm install

      - name: Build Assets
        run: npm run production

      # Step 5: Ensure vendor & compiled assets are tracked
      - name: Include vendor and public assets
        run: |
          git add vendor
          git add public/js public/css public/build || true
          git commit -m "Add vendor and compiled assets" || echo "Nothing to commit"

      # Step 6: Deploy via FTP
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.5.0
        with:
          server: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          password: ${{ secrets.CPANEL_PASSWORD }}
          port: 21
          local-dir: ./                     # Root of your repo
          server-dir: /public_html/futureconnect/  # Adjust to your cPanel folder
          git-ftp-args: --insecure
