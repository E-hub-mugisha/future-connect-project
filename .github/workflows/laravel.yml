name: Deploy Laravel App to cPanel via FTP

on:
  push:
    branches:
      - main   # Change this if your deployment branch is different

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Upload files via FTP
      - name: Deploy via FTP to cPanel
        uses: samkirkland/ftp-deploy-action@v4.4.0
        with:
          server: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          password: ${{ secrets.CPANEL_PASSWORD }}
          port: 21
          protocol: ftp
          security: loose
          passive: true
          local-dir: ./
          server-dir: /public_html/futureconnect/
          exclude: |
            **/.git*
            **/node_modules/**
            **/.github/**
            **/tests/**
            **/storage/framework/cache/data/**
            **/storage/debugbar/**
          debug: true
