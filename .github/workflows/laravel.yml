name: Deploy Laravel via FTP

on:
  push:
    branches:
      - main  # Deploy only when main branch is updated

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout your repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Deploy all project files via FTP
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.0
        with:
          server: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          password: ${{ secrets.CPANEL_PASSWORD }}
          port: 21
          local-dir: ./                     # Root of your repo
          server-dir: /public_html/futureconnect/  # Path on cPanel
          git-ftp-args: --insecure
